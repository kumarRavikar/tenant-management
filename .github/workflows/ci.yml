name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tenant_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --include=dev

      - name: Verify Jest Dependencies
        working-directory: backend
        run: |
          npm list ts-node
          node -e "console.log(require.resolve('ts-node'))"
          npm list jest ts-jest ts-node

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Compile Backend TypeScript
        working-directory: backend
        run: npm run build

      - name: Run Backend Test Suites
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/tenant_management_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-jwt-access-secret-32-chars-long!
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-32-chars-long!
          PORT: 5000
          CLIENT_URL: http://localhost:5173
        run: npm test

  frontend-ci:
    name: Frontend Lint, Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm test -- --run
